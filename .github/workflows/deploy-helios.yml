name: Deploy Projects to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "Simple Projects V1/Helios_SMS_FV1/frontend/**"
      - "Simple Projects V1/RN0826_WebSite/**"
      - ".github/workflows/deploy-helios.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: projects-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Simple Projects V1/Helios_SMS_FV1/frontend/package-lock.json"

      - name: Install Helios dependencies
        working-directory: "Simple Projects V1/Helios_SMS_FV1/frontend"
        run: npm ci

      - name: Build Helios
        working-directory: "Simple Projects V1/Helios_SMS_FV1/frontend"
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site/rn0826

          cp -r "Simple Projects V1/Helios_SMS_FV1/frontend/dist/." "_site/"

          cp -r "Simple Projects V1/RN0826_WebSite/." "_site/rn0826/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
